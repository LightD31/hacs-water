# =============================================================
# Climatisation Solaire (flows-clim.json) — cartes d'exemple
# Cartes Home Assistant natives, aucune ressource Lovelace requise.
# =============================================================

# --- Vue d'ensemble : budget de surplus et priorité eau chaude ---
- type: markdown
  content: >-
    {% set s = states.sensor.clim_automation %}
    {% if s is none %}
    **sensor.clim_automation** absent, flow Node-RED à déployer.
    {% else %}
    {% set a = s.attributes %}
    ## {{ s.state }}

    {{ a.reason }}

    | | |
    |---|---|
    | Surplus potentiel | {{ a.potential_surplus }} W |
    | Réservé eau chaude | {{ a.cumulus_reserve_w }} W
      (priorité jusqu'à {{ a.hot_water_priority_temp }} °C) |
    | **Disponible clim** | **{{ a.available_w }} W** →
      {{ a.fundable_units }} unité(s) finançable(s) |
    | Unités en marche | {{ a.active_count }} / {{ a.max_units }}
      {%- if a.active_units %} ({{ a.active_units | join(', ') }}){% endif %} |
    | Conso estimée | {{ a.clim_draw_estimated }} W
      · {{ a.clim_kwh_today }} kWh aujourd'hui |

    {% if a.preempted_by_hot_water %}
    ⚠️ Surplus suffisant mais **réservé à l'eau chaude** :
    {{ a.cumulus_reserve_reason }}
    {% elif a.hard_stop %}
    ⛔ **Import réseau confirmé**, délestage en cours.
    {% elif a.shed_deferred %}
    ⏳ Délestage de {{ a.shed_blocked_by }} en attente de son min-run.
    {% elif a.tier_pending_min > 0 %}
    ⏳ Palier {{ a.tier_candidate }} unité(s) en confirmation,
    {{ a.tier_pending_min }} min.
    {% elif a.manual_count > 0 %}
    ✋ {{ a.manual_count }} unité(s) allumée(s) hors automatisation, non modifiée(s).
    {% endif %}
    {% endif %}


# --- Détail par pièce, dans l'ordre de priorité ---
- type: markdown
  content: >-
    {% set units = state_attr('sensor.clim_automation', 'units') %}
    {% if units %}
    ### Pièces, par ordre de priorité

    | # | Pièce | Temp. | Demande | Consigne | État |
    |---|---|---|---|---|---|
    {% for u in units -%}
    | {{ u.priority }} | {{ u.label }}
    | {{ u.current_temp if u.current_temp is not none else '—' }} °C
    | {{ {'cool': '❄️ froid', 'heat': '🔥 chaud', 'none': '—'}[u.need_mode] }}
    | {{ u.store_target if u.store_target is not none else '—' }}
    | {% if not u.available %}injoignable
      {%- elif u.manual_control %}✋ manuel
      {%- elif u.hold_active %}⏸ pause
      {%- elif u.desired == 'on' and u.owned %}✅ en marche
      {%- elif u.min_off_left_min > 0 %}⏳ {{ u.min_off_left_min }} min
      {%- else %}veille{% endif %} |
    {% endfor %}
    {% endif %}


# --- Réglages ---
- type: entities
  title: Réglages confort gratuit
  entities:
    - entity: input_boolean.clim_automation_enabled
      name: Automatisation
    - entity: input_select.clim_season_mode
      name: Mode saison
    - entity: input_number.clim_target_cool
      name: Cible rafraîchissement
    - entity: input_number.clim_target_heat
      name: Cible chauffage
    - entity: input_number.clim_surplus_trigger
      name: Seuil de surplus par unité
    - type: divider
    - entity: climate.salon_room_temperature
      name: Salon
    - entity: climate.daikinap21104_room_temperature
      name: Cuisine
    - entity: climate.chambre_tom_room_temperature
      name: Chambre Tom
    - entity: climate.chambre_didier_room_temperature
      name: Chambre Didier
    - entity: climate.chambre_marie_room_temperature
      name: Chambre Marie


# --- Diagnostic ---
- type: entities
  title: Diagnostic
  entities:
    - type: attribute
      entity: sensor.clim_automation
      attribute: cumulus_reserve_reason
      name: Priorité eau chaude
    - type: attribute
      entity: sensor.clim_automation
      attribute: available_w
      name: Surplus disponible
      suffix: " W"
    - type: attribute
      entity: sensor.clim_automation
      attribute: target_count
      name: Unités visées
    - type: attribute
      entity: sensor.clim_automation
      attribute: grid_importing
      name: Import réseau
    - type: attribute
      entity: sensor.clim_automation
      attribute: eligible_count
      name: Pièces éligibles
    - type: attribute
      entity: sensor.clim_automation
      attribute: last_action
      name: Dernière action
    - type: attribute
      entity: sensor.clim_automation
      attribute: last_update
      name: Mise à jour


# --- Chip compacte pour un header ---
- type: markdown
  content: >-
    {% set a = state_attr('sensor.clim_automation', 'available_w') %}
    {% set r = state_attr('sensor.clim_automation', 'cumulus_reserve_w') %}
    {% set n = state_attr('sensor.clim_automation', 'active_count') %}
    ❄️ {{ states('sensor.clim_automation') }} · {{ n }} unité(s) · {{ a }} W libres
    {%- if r and r > 0 %} · {{ r }} W à l'eau chaude{% endif %}
