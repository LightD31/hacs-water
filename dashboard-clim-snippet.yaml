# =============================================================
# Climatisation Solaire — cartes d'exemple
# =============================================================

# --- Carte dédiée (clim-solaire-card.js) ---
- type: custom:clim-solaire-card
  entity: sensor.clim_automation

# --- Sans la liste des pièces, réglages toujours ouverts ---
- type: custom:clim-solaire-card
  entity: sensor.clim_automation
  show_units: false
  show_settings: expanded

# --- Helpers personnalisés, ou lignes masquées ---
- type: custom:clim-solaire-card
  entity: sensor.clim_automation
  controls:
    import_allowance: false         # masque le slider
    target_cool: input_number.mon_helper

# =============================================================
# Les cartes ci-dessous couvrent le même besoin en cartes Home
# Assistant natives, sans ressource Lovelace supplémentaire.
# =============================================================

# --- Vue d'ensemble : routeur solaire et priorité eau chaude ---
- type: markdown
  content: >-
    {% set s = states.sensor.clim_automation %}
    {% if s is none %}
    **sensor.clim_automation** absent, flow Node-RED à déployer.
    {% else %}
    {% set a = s.attributes %}
    ## {{ s.state }}

    {{ a.reason }}

    | | |
    |---|---|
    | Export lissé | {{ a.export_avg_w }} W (marge {{ a.export_margin_w }} W) |
    | **Écart corrigé** | **{{ a.error_w }} W** · {{ a.router_detail }} |
    | Unités en marche | {{ a.active_count }} / {{ a.max_units }}
      {%- if a.active_units %} ({{ a.active_units | join(', ') }}){% endif %} |
    | Conso clim pilotée | {{ a.recoverable_w }} W sur {{ a.clim_power_total_w }} W mesurés |
    | Aujourd'hui | {{ a.clim_kwh_today }} kWh
      {%- if a.clim_solar_share_today is defined %} · {{ a.clim_solar_share_today }} % solaire{% endif %} |
    | Saison | {{ a.season_mode }} · {{ a.season_basis }} |

    {% if a.cumulus_heating %}
    💧 Le cumulus chauffe : il passe avant le confort, la clim prend le reste.
    {% endif %}
    {% if a.allowance_active %}
    🔌 Tolérance d'import active ({{ a.import_allowance_w }} W) : pièce hors de sa cible.
    {% endif %}
    {% if a.manual_count > 0 %}
    ✋ {{ a.manual_count }} unité(s) pilotée(s) à la main, non modifiée(s).
    {% endif %}

    {% for g in a.groups if not g.breaker_on %}
    🔌 Disjoncteur **{{ g.name }}** hors tension : pièces de ce groupe
    indisponibles pour le confort gratuit.
    {% endfor %}
    {% endif %}


# --- Détail par pièce, dans l'ordre de priorité ---
- type: markdown
  content: >-
    {% set units = state_attr('sensor.clim_automation', 'units') %}
    {% if units %}
    ### Pièces, par ordre de priorité

    | # | Pièce | Temp. | Demande | Consigne | Puissance | État |
    |---|---|---|---|---|---|---|
    {% for u in units -%}
    | {{ u.priority }} | {{ u.label }}
    | {{ u.current_temp if u.current_temp is not none else '—' }} °C
    | {{ {'cool': '❄️ froid', 'heat': '🔥 chaud', 'none': '—'}[u.need_mode] }}
    | {{ u.target_setpoint if u.target_setpoint is not none else '—' }}
      {%- if u.deep_setpoint is not none %} ({{ u.deep_setpoint }}…{{ u.idle_setpoint }}){% endif %}
    | {{ u.power_w }} W (appris {{ u.learned_w }} W)
    | {% if not u.breaker_on %}🔌 disjoncteur coupé
      {%- elif not u.available %}injoignable
      {%- elif u.manual_control %}✋ manuel
      {%- elif u.hold_active %}⏸ pause
      {%- elif u.desired == 'on' and u.owned %}✅ en marche
      {%- elif u.min_off_left_min > 0 %}⏳ {{ u.min_off_left_min }} min
      {%- else %}veille{% endif %} |
    {% endfor %}
    {% endif %}


# --- Réglages ---
- type: entities
  title: Réglages confort gratuit
  entities:
    - entity: input_boolean.clim_automation_enabled
      name: Automatisation
    - entity: input_select.clim_season_mode
      name: Mode saison
    - entity: input_number.clim_target_cool
      name: Cible rafraîchissement
    - entity: input_number.clim_target_heat
      name: Cible chauffage
    - entity: input_number.clim_import_allowance
      name: Tolérance d'import (pièce hors cible)
    - entity: input_text.clim_priority_order
      name: Ordre de priorité
    - type: divider
    - entity: climate.salon_room_temperature
      name: Salon
    - entity: climate.daikinap21104_room_temperature
      name: Cuisine
    - entity: climate.chambre_tom_room_temperature
      name: Chambre Tom
    - entity: climate.chambre_didier_room_temperature
      name: Chambre Didier
    - entity: climate.chambre_marie_room_temperature
      name: Chambre Marie


# --- Diagnostic ---
- type: entities
  title: Diagnostic
  entities:
    - type: attribute
      entity: sensor.clim_automation
      attribute: router_detail
      name: Routeur
    - type: attribute
      entity: sensor.clim_automation
      attribute: error_w
      name: Écart corrigé
      suffix: " W"
    - type: attribute
      entity: sensor.clim_automation
      attribute: recoverable_w
      name: Conso rendue au cumulus si besoin
      suffix: " W"
    - type: attribute
      entity: sensor.clim_automation
      attribute: season_basis
      name: Base de la saison
    - entity: switch.clim_nord
      name: Disjoncteur Clim Nord
    - entity: switch.clim_sud
      name: Disjoncteur Clim Sud
    - type: attribute
      entity: sensor.clim_automation
      attribute: last_action
      name: Dernière action
    - type: attribute
      entity: sensor.clim_automation
      attribute: last_update
      name: Mise à jour


# --- Chip compacte pour un header ---
- type: markdown
  content: >-
    {% set e = state_attr('sensor.clim_automation', 'export_avg_w') %}
    {% set w = state_attr('sensor.clim_automation', 'recoverable_w') %}
    {% set n = state_attr('sensor.clim_automation', 'active_count') %}
    ❄️ {{ states('sensor.clim_automation') }} · {{ n }} unité(s), {{ w }} W · export {{ e }} W
