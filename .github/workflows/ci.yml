name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Les flows livrés sont générés depuis nodered/ : ils ne doivent pas dériver.
      - name: Flows Node-RED à jour avec leurs sources
        run: node tools/build-flows.js --check

      # Simulations : exécutent les corps réels des nœuds function sur une
      # horloge accélérée, un registre d'états HA factice et un modèle physique
      # (ballon, unités inverter, compteur réseau bouclé).
      - name: Simulation du flow cumulus
        run: node tests/cumulus-flow-sim.js

      - name: Simulation du flow climatisation
        run: node tests/clim-flow-sim.js

      - name: Simulation couplée des deux flows
        run: node tests/coupled-flows-sim.js

      # Invariants du dépôt : manifeste HACS, intégrité des deux graphes,
      # absence de collision d'identifiants entre eux, cartes enregistrées,
      # archive complète.
      - name: Intégrité du dépôt
        run: node tools/validate-repo.js

      - name: Fichier livré à HACS, à jour
        run: node tools/build-hacs-bundle.js --check
